services:
  - type: web
    name: signora-backend
    runtime: go
    rootDir: backend
    buildCommand: go build -o signora ./cmd/server/main.go && npm install --omit=dev
    startCommand: ./signora
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
      - key: SIGNED_DIR
        value: ./signed
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
